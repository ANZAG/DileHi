name: Build & Deploy

# ACHTUNG, ZIEL PRÜFEN.
#
# Diese Datei lädt die gebaute Seite per FTP irgendwohin — und wohin, steht
# hier in der Datei, nicht im Zugang. Die drei FTP-Geheimnisse bringen den
# Ablauf nur bis ins Konto; dort liegen bei den meisten Hostern mehrere
# Verzeichnisse nebeneinander, eines je Domain.
#
# Wer DING kopiert, ändert als Erstes die Zeile `ZIEL:` ganz unten im Schritt
# „Deploy via FTPS". Sonst lädt die Kopie in das Verzeichnis des Vereins, von
# dem sie abstammt, und `mirror --delete` räumt dort auf, was nicht im Build
# steht. Beinahe genau so ist es schon einmal gelaufen: Eine Kopie zeigte
# weiter auf die Seite eines laufenden Vereins und scheiterte nur daran, dass
# die FTP-Geheimnisse in ihrem Projekt fehlten.
#
# Ohne FTP_SERVER, FTP_USERNAME und FTP_PASSWORD läuft der Schritt ins Leere —
# gebaut und geprüft wird trotzdem alles. Wer die Seite von einem Hoster bauen
# lässt (Netlify, Vercel, Cloudflare Pages), braucht nur die Prüfung und kann
# den Job `deploy` ganz löschen; siehe docs/installation.md, Schritt 5.

on:
  # Hochgeladen wird allein aus main (siehe deploy); sonst wird nur geprüft.
  push:
    branches:
      - main
      # Auch die Arbeitszweige. Vorher lief die Prüfung erst, wenn jemand
      # einen Pull Request aufmachte – also oft Stunden nach dem Push, und
      # bei einem Zweig ohne PR gar nicht. Gebaut wird hier nichts (der
      # deploy-Job hängt an main), es kostet also nur die zwei Minuten
      # Prüfung.
      - 'claude/**'
  # Auch Pull Requests prüfen. Vorher liefen sie durch kein Raster: Die
  # Prüfung kam erst mit dem Push nach dem Merge, also nachdem jemand
  # entschieden hatte. Der deploy-Job unten hängt an einem Push auf main und
  # bleibt davon unberührt – ein Pull Request lädt nichts hoch.
  pull_request:
    branches:
      - main
jobs:
  seo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Dieselbe Version wie beim Bauen. Mit Node 20 fehlten den Tests
          # eingebautes WebSocket und fs.globSync – lokal (Node 24) grün,
          # hier rot, und das am 11.09.2026 mitten im Ausrollen.
          node-version: 24
      - name: Install
        run: npm install
      - name: ESLint (alt-text, label-has-associated-control, a11y)
        run: npm run lint
      - name: SEO check (meta, JSON-LD, sitemap, robots)
        run: npm run seo:check
      # Der Build laeuft ueber SWC und prueft keine Typen. Ohne diesen Schritt
      # koennen Typfehler unbemerkt bis in die Produktion durchlaufen.
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      # Die Edge Functions laufen unter Deno und fielen bisher durch jedes
      # Raster. Beim ersten Lauf am 11.09.2026 fand diese Prüfung einen echten
      # Fehler: Der Aufnahmeantrag hat die Antworten auf die Zusatzfragen nie
      # gespeichert. Eigene Konfiguration (typecheck.json statt deno.json),
      # damit das Ausrollen bei Supabase davon unberührt bleibt.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions (Typen)
        run: deno check --no-lock --config supabase/functions/typecheck.json supabase/functions
      - name: Unit tests (Kalender-Export, Formular-Bedingungen)
        run: npm test
  deploy:
    needs: seo-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Node.js setup
        uses: actions/setup-node@v5
        with:
          node-version: 24
      # Bis zum Umzug stand die Adresse der Datenbank in einer eingecheckten
      # .env. Jeder Build ohne eigene Angaben sprach damit mit der Datenbank
      # von DileHi – auch der eines fremden Vereins. Jetzt holt der Build sie
      # aus dem Projekt, wie die Probeseite. Fehlt sie, bricht er ab
      # (vite.config.ts).
      - name: Datenbank-Adresse und öffentlichen Schlüssel holen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          anon=$(curl -sS -f "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "Kein anon-Schlüssel im Projekt gefunden."
            exit 1
          fi
          echo "::add-mask::$anon"
          {
            echo "VITE_SUPABASE_URL=https://$REF.supabase.co"
            echo "VITE_SUPABASE_PROJECT_ID=$REF"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon"
          } >> "$GITHUB_ENV"
      - name: Install & Build
        run: |
          npm install
          npm run build
      # Die Seite hinter ein Passwort.
      #
      # Fuer Vorfuehrsysteme und Probeinstallationen: ding.dilehi.de zeigt
      # DING mit echten Inhalten, und das gehoert nicht ins offene Netz. Der
      # Schutz ist Apache-Basisauthentifizierung -- er haengt vor der ganzen
      # Seite, nicht vor einzelnen Adressen, und er ersetzt keine Anmeldung:
      # Was im Mitgliederbereich geschuetzt ist, schuetzen weiter die
      # Zugriffsregeln der Datenbank.
      #
      # Ohne SITE_PASSWORT passiert hier nichts. Eine gewoehnliche
      # Installation laesst die drei Angaben weg und merkt von diesem Schritt
      # nur eine Zeile in der Zusammenfassung.
      #
      #   Secrets:    SITE_PASSWORT_BENUTZER   der Benutzername
      #               SITE_PASSWORT            das Passwort im Klartext. Es
      #                                        wird hier verschluesselt und
      #                                        steht nirgends im Repository.
      #   Variables:  SITE_PASSWORT_DATEI      der ABSOLUTE Pfad der .htpasswd,
      #                                        so wie der SERVER sie sieht.
      #
      #     Das ist nicht der FTP-Pfad. Der FTP-Zugang sieht oft nur
      #     /euer-verein.de/, waehrend auf der Platte etwas wie
      #     /var/www/vhosts/euer-verein.de/httpdocs/ steht -- Apache will das
      #     zweite. Und es ist genau das Verzeichnis, in das dieser Deploy
      #     laedt (ZIEL weiter unten), denn dorthin legt der Schritt die Datei:
      #
      #         <Serverpfad von ZIEL>/.htpasswd
      #
      #     Zeigt der Pfad woandershin, laedt die Datei trotzdem neben die
      #     Seite, Apache sucht sie am angegebenen Ort, findet nichts -- und
      #     antwortet mit 500. Der Schritt "Schutz nachsehen" unten sagt das
      #     nach dem Deploy in einem Satz.
      #               SITE_PASSWORT_BEREICH    Beschriftung im Anmeldefenster
      #
      # Die .htpasswd landet im selben Verzeichnis wie die Seite, weil ein
      # FTP-Zugang selten hoeher reicht. Der <Files>-Block darunter sperrt sie
      # gegen Abruf -- ohne ihn laege die Passwortdatei im Netz.
      - name: Verzeichnisschutz
        env:
          BENUTZER: ${{ secrets.SITE_PASSWORT_BENUTZER }}
          PASSWORT: ${{ secrets.SITE_PASSWORT }}
          DATEI: ${{ vars.SITE_PASSWORT_DATEI }}
          BEREICH: ${{ vars.SITE_PASSWORT_BEREICH }}
        run: |
          if [ -z "$PASSWORT" ]; then
            echo "::notice::Kein SITE_PASSWORT hinterlegt - die Seite bleibt oeffentlich."
            exit 0
          fi
          # Halb eingetragen ist nicht kaputt.
          #
          # Hier stand ein `exit 1`, und das war falsch: Wer SITE_PASSWORT
          # anlegt und den Pfad noch sucht, hat damit keine ungeschuetzte
          # Seite, sondern eine Auslieferung, die gar nicht mehr laeuft --
          # der Deploy-Schritt wird uebersprungen, die Seite bleibt auf dem
          # Stand von vorgestern. Eine freiwillige Zusatzeinstellung darf das
          # nicht. Also: Schutz weglassen, weitermachen, und es so laut sagen,
          # dass es niemand ueberliest.
          fehlt=""
          [ -z "$BENUTZER" ] && fehlt="$fehlt SITE_PASSWORT_BENUTZER"
          [ -z "$DATEI" ]    && fehlt="$fehlt SITE_PASSWORT_DATEI"
          case "$DATEI" in
            ""|/*) ;;
            *) fehlt="$fehlt SITE_PASSWORT_DATEI(kein-absoluter-Pfad)" ;;
          esac
          if [ -n "$fehlt" ]; then
            echo "::warning::Verzeichnisschutz NICHT gesetzt - es fehlt:$fehlt. Die Seite geht oeffentlich online."
            {
              echo "### Achtung: die Seite ist OEFFENTLICH"
              echo ""
              echo "\`SITE_PASSWORT\` ist hinterlegt, aber es fehlt:$fehlt"
              echo ""
              echo "Der Verzeichnisschutz wurde deshalb **nicht** gesetzt und die Seite"
              echo "ist ohne Passwort erreichbar. Hochgeladen wurde trotzdem -- eine"
              echo "fehlende Angabe soll die Auslieferung nicht anhalten."
              echo ""
              echo "\`SITE_PASSWORT_DATEI\` ist der absolute Pfad der \`.htpasswd\`, so wie"
              echo "der **Server** sie sieht -- nicht der FTP-Pfad. Am schnellsten zu"
              echo "finden: im Kundenmenue des Hosters einmal den eigenen"
              echo "Verzeichnisschutz auf einen beliebigen Ordner setzen und in die dort"
              echo "erzeugte \`.htaccess\` sehen; die Zeile \`AuthUserFile\` zeigt die"
              echo "richtige Schreibweise."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # -apr1 ist Apaches eigener Hash und laeuft auf jedem Webspace.
          # Das Klartextpasswort verlaesst diesen Schritt nicht.
          hash=$(openssl passwd -apr1 "$PASSWORT")
          name=$(basename "$DATEI")
          printf '%s:%s\n' "$BENUTZER" "$hash" > "dist/$name"

          # Vor die bestehende .htaccess, nicht dahinter: Die Anweisungen
          # gelten fuer das ganze Verzeichnis, und wer die Datei aufmacht,
          # soll als Erstes sehen, dass hier ein Schutz haengt.
          #
          # ASCII, wie der Rest der Datei (public/.htaccess erklaert, warum).
          {
            echo "# Verzeichnisschutz. Gesetzt beim Bauen aus SITE_PASSWORT;"
            echo "# von Hand geaenderte Zeilen ueberschreibt der naechste Deploy."
            echo "AuthType Basic"
            echo "AuthName \"${BEREICH:-Geschlossener Bereich}\""
            echo "AuthUserFile $DATEI"
            echo "Require valid-user"
            echo ""
            echo "# Die Passwortdatei selbst ist nicht abrufbar. Beide Schreibweisen,"
            echo "# weil Apache 2.2 die von 2.4 nicht kennt und umgekehrt."
            echo "<Files \"$name\">"
            echo "  <IfModule mod_authz_core.c>"
            echo "    Require all denied"
            echo "  </IfModule>"
            echo "  <IfModule !mod_authz_core.c>"
            echo "    Order allow,deny"
            echo "    Deny from all"
            echo "  </IfModule>"
            echo "</Files>"
            echo ""
            cat dist/.htaccess
          } > dist/.htaccess.neu
          mv dist/.htaccess.neu dist/.htaccess

          # Eine Seite hinter einem Passwort hat in Suchmaschinen nichts
          # verloren. Ein Crawler kommt ohnehin nicht hinein; das hier spart
          # ihm den Versuch und haelt die Adresse aus den Ergebnissen.
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

          {
            echo "### Verzeichnisschutz aktiv"
            echo ""
            echo "Benutzer \`$BENUTZER\`, Passwortdatei \`$DATEI\`."
            echo "Stimmt der Pfad nicht, antwortet der Server mit 500 statt mit dem Anmeldefenster."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Wohin die gebaute Seite geht. Beim Kopieren dieses Repos ist das
          # die erste Zeile, die geaendert gehoert: Sonst laedt die Kopie in
          # das Verzeichnis des Vereins, von dem sie abstammt.
          ZIEL: /dilehi.de/
        run: |
          # Eine Kopie dieses Repos hat noch keine FTP-Zugaenge. Ohne diese
          # Zeilen scheitert dort jeder Push an einer lftp-Meldung, die
          # niemand liest -- und die eigentliche Auskunft ("hier fehlen drei
          # Geheimnisse") steht nirgends. Gebaut und geprueft ist trotzdem
          # alles, das Hochladen ist der letzte Handgriff.
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Kein FTP_SERVER hinterlegt - es wird nichts hochgeladen."
            {
              echo "### Nicht hochgeladen"
              echo ""
              echo "In diesem Projekt fehlen \`FTP_SERVER\`, \`FTP_USERNAME\` und \`FTP_PASSWORD\`."
              echo "Gebaut und geprueft wurde alles; nur der letzte Schritt entfaellt."
              echo "Wer die Seite von einem Hoster bauen laesst (Netlify, Vercel,"
              echo "Cloudflare Pages), braucht sie nicht - siehe docs/installation.md, Schritt 5."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror --reverse --delete --verbose ./dist/ $ZIEL
          "

      # Hat es geklappt?
      #
      # Ein Verzeichnisschutz ist die eine Einstellung, bei der "nichts
      # gemeldet" und "kaputt" gleich aussehen: Ein falscher AuthUserFile-Pfad
      # gibt 500, und das merkt man erst, wenn jemand die Seite aufruft. Also
      # ruft der Deploy sie selbst auf und sagt, was zurueckkam.
      #
      # Ohne SITE_URL laesst sich nichts nachsehen -- dann bleibt es beim
      # Hinweis. Ohne SITE_PASSWORT ist ohnehin nichts zu pruefen.
      - name: Schutz nachsehen
        if: ${{ vars.SITE_URL != '' }}
        env:
          PASSWORT: ${{ secrets.SITE_PASSWORT }}
          ADRESSE: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$PASSWORT" ]; then exit 0; fi
          # Kurz warten: Manche Hoster brauchen einen Moment, bis die neue
          # .htaccess greift.
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${ADRESSE%/}/" || echo "000")
          case "$code" in
            401)
              echo "::notice::Der Verzeichnisschutz greift (401)."
              { echo "### Verzeichnisschutz greift"; echo ""
                echo "\`${ADRESSE%/}/\` antwortet mit **401** -- das Anmeldefenster kommt."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            500)
              echo "::error::Die Seite antwortet mit 500. Fast immer stimmt SITE_PASSWORT_DATEI nicht."
              { echo "### Verzeichnisschutz: Fehler 500"
                echo ""
                echo "Die Seite antwortet mit **500**. Das heisst so gut wie immer:"
                echo "\`SITE_PASSWORT_DATEI\` zeigt auf einen Pfad, an dem Apache keine"
                echo "Passwortdatei findet."
                echo ""
                echo "Gesucht ist der Pfad, den der SERVER sieht -- nicht der FTP-Pfad --"
                echo "und zwar der des Verzeichnisses, in das dieser Deploy laedt."
                echo "Am schnellsten zu finden: im Kundenmenue des Hosters einmal den"
                echo "eigenen Verzeichnisschutz auf einen beliebigen Ordner setzen und in"
                echo "die dort erzeugte \`.htaccess\` sehen -- die Zeile \`AuthUserFile\`"
                echo "zeigt die richtige Schreibweise."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            200)
              echo "::warning::Die Seite ist ohne Passwort erreichbar (200)."
              { echo "### Verzeichnisschutz greift NICHT"
                echo ""
                echo "\`${ADRESSE%/}/\` antwortet mit **200** -- die Seite steht offen."
                echo "Moeglich ist, dass der Hoster \`AllowOverride\` nicht erlaubt und"
                echo "die \`.htaccess\` deshalb ignoriert wird."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::warning::Antwort $code - nicht eindeutig, bitte selbst nachsehen."
              echo "### Verzeichnisschutz: Antwort $code" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
