name: Build & Deploy

# ACHTUNG, ZIEL PRÜFEN.
#
# Diese Datei lädt die gebaute Seite per FTP irgendwohin — und wohin, steht
# hier in der Datei, nicht im Zugang. Die drei FTP-Geheimnisse bringen den
# Ablauf nur bis ins Konto; dort liegen bei den meisten Hostern mehrere
# Verzeichnisse nebeneinander, eines je Domain.
#
# Wer DING kopiert, ändert als Erstes die Zeile `ZIEL:` ganz unten im Schritt
# „Deploy via FTPS". Sonst lädt die Kopie in das Verzeichnis des Vereins, von
# dem sie abstammt, und `mirror --delete` räumt dort auf, was nicht im Build
# steht. Beinahe genau so ist es schon einmal gelaufen: Eine Kopie zeigte
# weiter auf die Seite eines laufenden Vereins und scheiterte nur daran, dass
# die FTP-Geheimnisse in ihrem Projekt fehlten.
#
# Ohne FTP_SERVER, FTP_USERNAME und FTP_PASSWORD läuft der Schritt ins Leere —
# gebaut und geprüft wird trotzdem alles. Wer die Seite von einem Hoster bauen
# lässt (Netlify, Vercel, Cloudflare Pages), braucht nur die Prüfung und kann
# den Job `deploy` ganz löschen; siehe docs/installation.md, Schritt 5.

on:
  # Hochgeladen wird allein aus main (siehe deploy); sonst wird nur geprüft.
  push:
    branches:
      - main
      # Auch die Arbeitszweige. Vorher lief die Prüfung erst, wenn jemand
      # einen Pull Request aufmachte – also oft Stunden nach dem Push, und
      # bei einem Zweig ohne PR gar nicht. Gebaut wird hier nichts (der
      # deploy-Job hängt an main), es kostet also nur die zwei Minuten
      # Prüfung.
      - 'claude/**'
  # Auch Pull Requests prüfen. Vorher liefen sie durch kein Raster: Die
  # Prüfung kam erst mit dem Push nach dem Merge, also nachdem jemand
  # entschieden hatte. Der deploy-Job unten hängt an einem Push auf main und
  # bleibt davon unberührt – ein Pull Request lädt nichts hoch.
  pull_request:
    branches:
      - main
jobs:
  seo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Dieselbe Version wie beim Bauen. Mit Node 20 fehlten den Tests
          # eingebautes WebSocket und fs.globSync – lokal (Node 24) grün,
          # hier rot, und das am 11.09.2026 mitten im Ausrollen.
          node-version: 24
      - name: Install
        run: npm install
      - name: ESLint (alt-text, label-has-associated-control, a11y)
        run: npm run lint
      - name: SEO check (meta, JSON-LD, sitemap, robots)
        run: npm run seo:check
      # Der Build laeuft ueber SWC und prueft keine Typen. Ohne diesen Schritt
      # koennen Typfehler unbemerkt bis in die Produktion durchlaufen.
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      # Die Edge Functions laufen unter Deno und fielen bisher durch jedes
      # Raster. Beim ersten Lauf am 11.09.2026 fand diese Prüfung einen echten
      # Fehler: Der Aufnahmeantrag hat die Antworten auf die Zusatzfragen nie
      # gespeichert. Eigene Konfiguration (typecheck.json statt deno.json),
      # damit das Ausrollen bei Supabase davon unberührt bleibt.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions (Typen)
        run: deno check --no-lock --config supabase/functions/typecheck.json supabase/functions
      - name: Unit tests (Kalender-Export, Formular-Bedingungen)
        run: npm test
  deploy:
    needs: seo-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Immer nur ein Hochladen auf einmal. Drei Pushes kurz hintereinander
    # liefen sonst gleichzeitig auf dasselbe Verzeichnis, und wer zuletzt
    # fertig wurde, bestimmte den Stand – nicht unbedingt der neueste. So
    # wartet ein neuer Lauf, bis der laufende fertig ist; ein wartender, den
    # ein noch neuerer ueberholt, faellt weg.
    concurrency:
      group: hochladen-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Node.js setup
        uses: actions/setup-node@v5
        with:
          node-version: 24
      # Bis zum Umzug stand die Adresse der Datenbank in einer eingecheckten
      # .env. Jeder Build ohne eigene Angaben sprach damit mit der Datenbank
      # von DileHi – auch der eines fremden Vereins. Jetzt holt der Build sie
      # aus dem Projekt, wie die Probeseite. Fehlt sie, bricht er ab
      # (vite.config.ts).
      - name: Datenbank-Adresse und öffentlichen Schlüssel holen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          anon=$(curl -sS -f "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "Kein anon-Schlüssel im Projekt gefunden."
            exit 1
          fi
          echo "::add-mask::$anon"
          {
            echo "VITE_SUPABASE_URL=https://$REF.supabase.co"
            echo "VITE_SUPABASE_PROJECT_ID=$REF"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon"
          } >> "$GITHUB_ENV"
      - name: Install & Build
        run: |
          npm install
          npm run build
      # Die Seite hinter ein Passwort.
      #
      # Fuer Vorfuehrsysteme und Probeinstallationen: ding.dilehi.de zeigt
      # DING mit echten Inhalten, und das gehoert nicht ins offene Netz. Der
      # Schutz haengt vor der ganzen Seite, nicht vor einzelnen Adressen, und
      # er ersetzt keine Anmeldung: Was im Mitgliederbereich geschuetzt ist,
      # schuetzen weiter die Zugriffsregeln der Datenbank.
      #
      # Ohne SITE_PASSWORT passiert hier nichts. Eine gewoehnliche
      # Installation laesst die Angaben weg und merkt von diesem Schritt nur
      # eine Zeile in der Zusammenfassung.
      #
      #   Secrets:    SITE_PASSWORT_BENUTZER   der Benutzername
      #               SITE_PASSWORT            das Passwort im Klartext. Es
      #                                        verlaesst diesen Schritt nicht
      #                                        und steht nirgends im Repository.
      #   Variables:  SITE_PASSWORT_BEREICH    Beschriftung im Anmeldefenster
      #               SITE_PASSWORT_DATEI      optional, siehe unten
      #
      # Es gibt zwei Wege, und der Unterschied ist SITE_PASSWORT_DATEI:
      #
      #   ohne SITE_PASSWORT_DATEI  -> Kopfzeilen-Weg (die Vorgabe)
      #
      #     Die Anmeldung laeuft ueber mod_rewrite und mod_headers. Es gibt
      #     keine Passwortdatei, also auch keinen Pfad, der falsch sein kann.
      #     Beide Module braucht diese Seite ohnehin (public/.htaccess).
      #
      #     Preis: Benutzer und Passwort stehen base64-kodiert in der
      #     .htaccess auf dem Webspace. Base64 ist keine Verschluesselung, nur
      #     eine Schreibweise. Apache liefert .ht*-Dateien nicht aus, und im
      #     Repository steht die Zeile nirgends -- der Build setzt sie. Fuer
      #     ein Vorfuehrsystem reicht das; fuer Daten, die wirklich niemanden
      #     angehen, nimmt man den zweiten Weg.
      #
      #   mit SITE_PASSWORT_DATEI   -> Passwortdatei-Weg
      #
      #     Klassische Basisauthentifizierung mit apr1-gehashter .htpasswd.
      #     SITE_PASSWORT_DATEI ist dabei der ABSOLUTE Pfad dieser Datei, so
      #     wie der SERVER sie sieht -- nicht der FTP-Pfad. Der FTP-Zugang
      #     sieht oft nur /euer-verein.de/, waehrend auf der Platte etwas wie
      #     /var/www/vhosts/euer-verein.de/httpdocs/ steht; Apache will das
      #     zweite. Und es ist genau das Verzeichnis, in das dieser Deploy
      #     laedt (ZIEL weiter unten), denn dorthin legt der Schritt die Datei:
      #
      #         <Serverpfad von ZIEL>/.htpasswd
      #
      #     Stimmt der Pfad nicht, kommt zuerst das Anmeldefenster und danach
      #     ein Fehler 500: Apache liest die Passwortdatei erst, wenn jemand
      #     Zugangsdaten abschickt. Vorher faellt nichts auf. Der Schritt
      #     "Schutz nachsehen" unten meldet sich deshalb selbst an und prueft
      #     genau das.
      #
      # Die .htpasswd landet im selben Verzeichnis wie die Seite, weil ein
      # FTP-Zugang selten hoeher reicht. Der <Files>-Block darunter sperrt sie
      # gegen Abruf -- ohne ihn laege die Passwortdatei im Netz.
      - name: Verzeichnisschutz
        env:
          BENUTZER: ${{ secrets.SITE_PASSWORT_BENUTZER }}
          PASSWORT: ${{ secrets.SITE_PASSWORT }}
          DATEI: ${{ vars.SITE_PASSWORT_DATEI }}
          BEREICH: ${{ vars.SITE_PASSWORT_BEREICH }}
        run: |
          if [ -z "$PASSWORT" ]; then
            echo "::notice::Kein SITE_PASSWORT hinterlegt - die Seite bleibt oeffentlich."
            exit 0
          fi
          # Halb eingetragen ist nicht kaputt.
          #
          # Hier stand ein `exit 1`, und das war falsch: Wer SITE_PASSWORT
          # anlegt und eine zweite Angabe noch sucht, hat damit keine
          # ungeschuetzte Seite, sondern eine Auslieferung, die gar nicht mehr
          # laeuft -- der Deploy-Schritt wird uebersprungen, die Seite bleibt
          # auf dem Stand von vorgestern. Eine freiwillige Zusatzeinstellung
          # darf das nicht. Also: weitermachen und es laut sagen.
          if [ -z "$BENUTZER" ]; then
            echo "::warning::SITE_PASSWORT_BENUTZER fehlt - kein Schutz gesetzt, die Seite geht oeffentlich online."
            {
              echo "### Achtung: die Seite ist OEFFENTLICH"
              echo ""
              echo "\`SITE_PASSWORT\` ist hinterlegt, aber \`SITE_PASSWORT_BENUTZER\` fehlt."
              echo "Ohne Benutzernamen gibt es keine Anmeldung. Hochgeladen wurde trotzdem --"
              echo "eine fehlende Angabe soll die Auslieferung nicht anhalten."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BEREICH="${BEREICH:-Geschlossener Bereich}"

          # Welcher Weg? Ein absoluter Pfad heisst Passwortdatei, alles andere
          # heisst Kopfzeilen. Ein relativer Pfad ist fast sicher ein
          # Missverstaendnis (der FTP-Pfad), und der endet in 500 -- lieber
          # den Weg nehmen, der ohne Pfad auskommt, und es dazusagen.
          WEG=kopfzeile
          case "$DATEI" in
            /*) WEG=passwortdatei ;;
            "") ;;
            *)  echo "::warning::SITE_PASSWORT_DATEI ist kein absoluter Pfad - es wird der Kopfzeilen-Weg genommen." ;;
          esac

          if [ "$WEG" = passwortdatei ]; then
            # -apr1 ist Apaches eigener Hash und laeuft auf jedem Webspace.
            # Das Klartextpasswort verlaesst diesen Schritt nicht.
            hash=$(openssl passwd -apr1 "$PASSWORT")
            name=$(basename "$DATEI")
            printf '%s:%s\n' "$BENUTZER" "$hash" > "dist/$name"
            {
              echo "# Verzeichnisschutz. Gesetzt beim Bauen aus SITE_PASSWORT;"
              echo "# von Hand geaenderte Zeilen ueberschreibt der naechste Deploy."
              echo "AuthType Basic"
              printf 'AuthName "%s"\n' "$BEREICH"
              echo "AuthUserFile $DATEI"
              echo "Require valid-user"
              echo ""
              echo "# Die Passwortdatei selbst ist nicht abrufbar. Beide Schreibweisen,"
              echo "# weil Apache 2.2 die von 2.4 nicht kennt und umgekehrt."
              printf '<Files "%s">\n' "$name"
              echo "  <IfModule mod_authz_core.c>"
              echo "    Require all denied"
              echo "  </IfModule>"
              echo "  <IfModule !mod_authz_core.c>"
              echo "    Order allow,deny"
              echo "    Deny from all"
              echo "  </IfModule>"
              echo "</Files>"
            } > dist/.htaccess.kopf
            # Der Upload-Schritt muss wissen, wie die Datei heisst: Sie geht
            # VOR allem anderen hoch, damit die .htaccess nie auf eine
            # Passwortdatei zeigt, die noch nicht da ist.
            echo "SCHUTZDATEI=$name" >> "$GITHUB_ENV"
            echo "SCHUTZ_WEG=passwortdatei" >> "$GITHUB_ENV"
          else
            # Kein AuthType, keine Passwortdatei: Die Anmeldung wird von Hand
            # nachgebaut. Der Browser schickt seine Zugangsdaten als
            # `Authorization: Basic <base64>`; stimmt die Zeile nicht, gibt es
            # 401 und mit dem 401 die Aufforderung, sich anzumelden.
            #
            # Verglichen wird als Zeichenkette (`!=`), nicht als regulaerer
            # Ausdruck: Base64 enthaelt + und /, und die haetten als Muster
            # eine eigene Bedeutung.
            b64=$(printf '%s:%s' "$BENUTZER" "$PASSWORT" | base64 -w0)
            echo "::add-mask::$b64"
            {
              echo "# Verzeichnisschutz ohne Passwortdatei. Gesetzt beim Bauen aus"
              echo "# SITE_PASSWORT; von Hand geaenderte Zeilen ueberschreibt der"
              echo "# naechste Deploy. Steht hier vor allem anderen, damit keine Regel"
              echo "# darunter vorher greift."
              echo "<IfModule mod_rewrite.c>"
              echo "  RewriteEngine On"
              printf '  RewriteCond %%{HTTP:Authorization} "!=Basic %s"\n' "$b64"
              echo "  RewriteRule .* - [R=401,L]"
              echo "</IfModule>"
              echo "<IfModule mod_headers.c>"
              printf '  Header always set WWW-Authenticate "Basic realm=\\"%s\\""\n' "$BEREICH"
              echo "</IfModule>"
              echo 'ErrorDocument 401 "Anmeldung erforderlich."'
            } > dist/.htaccess.kopf
            echo "SCHUTZ_WEG=kopfzeile" >> "$GITHUB_ENV"
          fi

          # Vor die bestehende .htaccess, nicht dahinter: Die Anweisungen
          # gelten fuer das ganze Verzeichnis, und wer die Datei aufmacht, soll
          # als Erstes sehen, dass hier ein Schutz haengt.
          #
          # ASCII, wie der Rest der Datei (public/.htaccess erklaert, warum).
          { cat dist/.htaccess.kopf; echo ""; cat dist/.htaccess; } > dist/.htaccess.neu
          mv dist/.htaccess.neu dist/.htaccess
          rm -f dist/.htaccess.kopf

          # Eine Seite hinter einem Passwort hat in Suchmaschinen nichts
          # verloren. Ein Crawler kommt ohnehin nicht hinein; das hier spart
          # ihm den Versuch und haelt die Adresse aus den Ergebnissen.
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

          {
            echo "### Verzeichnisschutz aktiv"
            echo ""
            if [ "$WEG" = passwortdatei ]; then
              echo "Benutzer \`$BENUTZER\`, Passwortdatei \`$DATEI\` (apr1-Hash)."
              echo "Stimmt der Pfad nicht, kommt erst das Anmeldefenster und dann ein Fehler 500."
            else
              echo "Benutzer \`$BENUTZER\`, ohne Passwortdatei (mod_rewrite + mod_headers)."
              echo "Es gibt keinen Pfad, der falsch sein kann."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Wohin die gebaute Seite geht. Beim Kopieren dieses Repos ist das
          # die erste Zeile, die geaendert gehoert: Sonst laedt die Kopie in
          # das Verzeichnis des Vereins, von dem sie abstammt.
          ZIEL: /dilehi.de/
        run: |
          # Eine Kopie dieses Repos hat noch keine FTP-Zugaenge. Ohne diese
          # Zeilen scheitert dort jeder Push an einer lftp-Meldung, die
          # niemand liest -- und die eigentliche Auskunft ("hier fehlen drei
          # Geheimnisse") steht nirgends. Gebaut und geprueft ist trotzdem
          # alles, das Hochladen ist der letzte Handgriff.
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Kein FTP_SERVER hinterlegt - es wird nichts hochgeladen."
            {
              echo "### Nicht hochgeladen"
              echo ""
              echo "In diesem Projekt fehlen \`FTP_SERVER\`, \`FTP_USERNAME\` und \`FTP_PASSWORD\`."
              echo "Gebaut und geprueft wurde alles; nur der letzte Schritt entfaellt."
              echo "Wer die Seite von einem Hoster bauen laesst (Netlify, Vercel,"
              echo "Cloudflare Pages), braucht sie nicht - siehe docs/installation.md, Schritt 5."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo apt-get install -y lftp
          ZIEL="${ZIEL%/}/"

          ZUGANG="
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:max-retries 3;
            set net:timeout 20;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          "

          # Die Passwortdatei zuerst, und zwar allein.
          #
          # `mirror --delete` laedt in einer Reihenfolge hoch, die es sich
          # selbst aussucht. Landet die .htaccess vor der .htpasswd, gibt es
          # ein Fenster von einigen Minuten, in dem Apache eine Passwortdatei
          # sucht, die noch nicht da ist -- und dann antwortet es fuer das
          # GANZE Verzeichnis mit 500. Nicht mit "Seite laedt noch", nicht mit
          # der alten Fassung: mit einem Serverfehler, auf jede Adresse.
          #
          # Genau das ist am 18. September passiert, mitten in einem Deploy.
          # Also erst die Datei, die alles andere braucht, dann der Rest -- und
          # sie wird vom Spiegeln ausgenommen, damit `--delete` sie nicht kurz
          # wegraeumt und neu schreibt.
          # SCHUTZDATEI setzt der Schritt "Verzeichnisschutz" oben, wenn es
          # eine gibt. Sonst ist sie leer und alles bleibt beim Alten.
          AUSNAHME=""
          if [ -n "$SCHUTZDATEI" ] && [ -f "dist/$SCHUTZDATEI" ]; then
            lftp -c "$ZUGANG put -O $ZIEL dist/$SCHUTZDATEI"
            # Lesbar fuer Apache. Ein FTP-Server legt neue Dateien je nach
            # umask auch mal mit 600 an, und dann gehoert sie zwar dem
            # richtigen Konto, aber der Apache-Prozess kommt nicht hinein --
            # was aussieht wie ein falscher Pfad und ebenfalls 500 gibt.
            # Nicht jeder FTP-Server kann SITE CHMOD; deshalb kein Abbruch.
            lftp -c "$ZUGANG chmod 644 $ZIEL$SCHUTZDATEI" \
              || echo "::notice::SITE CHMOD ging nicht - falls 500 kommt, die Rechte der Passwortdatei von Hand auf 644 setzen."
            AUSNAHME="--exclude-glob $SCHUTZDATEI"
            echo "::notice::Passwortdatei $SCHUTZDATEI vorab hochgeladen."
          fi

          # Drei Durchlaeufe, in dieser Reihenfolge:
          #
          #   1. assets/ -- nur Neues dazu, nichts loeschen
          #   2. alles andere, darunter die index.html
          #   3. assets/ noch einmal, jetzt mit --delete
          #
          # Die index.html nennt die Dateien in assets/ beim Namen. Kam sie
          # zuerst, verwies sie waehrend des ganzen zweiten Durchlaufs auf
          # Teile, die es noch nicht gab: Wer in diesen Minuten eine Seite
          # oeffnete, bekam „Die Seite wurde aktualisiert" statt der Seite
          # (so beobachtet am 23. September). Jetzt liegt alles bereit, bevor
          # die neue index.html darauf zeigt, und die alten Teile gehen erst,
          # wenn nichts Neues mehr auf sie verweist.
          #
          # `mirror` laedt von sich aus nur hoch, was sich unterscheidet --
          # verglichen werden Groesse UND Zeitstempel. Jeder Build schreibt alle
          # Dateien neu, also gilt alles als geaendert. In assets/ steckt der
          # Inhalt aber schon im Dateinamen: Vite haengt eine Pruefsumme an
          # (index-a1b2c3d4.js). Gleicher Name heisst gleicher Inhalt --
          # `--ignore-time` nimmt den Zeitstempel dort heraus, und von den 3 MB
          # geht nur hoch, was neu ist.
          #
          # Alles ausserhalb von assets/ (index.html, sw.js, .htaccess,
          # robots.txt, Symbole) traegt keine Pruefsumme im Namen und geht
          # jedes Mal hoch. Das sind ein paar Dutzend Kilobyte.
          #
          # --parallel=4: vier Dateien gleichzeitig. Bei vielen kleinen Dateien
          # ist nicht die Leitung der Engpass, sondern das Hin und Her fuer
          # jede einzelne.
          if [ -d dist/assets ]; then
            lftp -c "$ZUGANG mirror --reverse --verbose --parallel=4 --ignore-time ./dist/assets/ ${ZIEL}assets/"
          fi
          lftp -c "$ZUGANG mirror --reverse --delete --verbose --parallel=4 --exclude '^assets/' $AUSNAHME ./dist/ $ZIEL"
          if [ -d dist/assets ]; then
            lftp -c "$ZUGANG mirror --reverse --delete --verbose --parallel=4 --ignore-time ./dist/assets/ ${ZIEL}assets/"
          fi

      # Hat es geklappt?
      #
      # Ein Verzeichnisschutz ist die eine Einstellung, bei der "nichts
      # gemeldet" und "kaputt" gleich aussehen. Und der haeufigste Fehler --
      # ein AuthUserFile-Pfad, den es auf dem Server nicht gibt -- faellt bei
      # einem Blick von aussen nicht auf: Der unangemeldete Abruf bekommt
      # ordentlich seine 401, Apache liest die Passwortdatei ja erst, wenn
      # jemand Zugangsdaten abschickt. Erst dann kommt der Fehler 500.
      #
      # Ein Schritt, der nur auf die 401 sieht, meldet also gruen, waehrend
      # niemand hineinkommt. Genau so ist es hier gelaufen. Deshalb wird
      # zweimal gefragt: einmal ohne Zugangsdaten (erwartet 401) und einmal
      # mit (erwartet 200).
      #
      # Ohne SITE_URL laesst sich nichts nachsehen. Ohne SITE_PASSWORT ist
      # nichts zu pruefen.
      - name: Schutz nachsehen
        if: ${{ vars.SITE_URL != '' }}
        env:
          BENUTZER: ${{ secrets.SITE_PASSWORT_BENUTZER }}
          PASSWORT: ${{ secrets.SITE_PASSWORT }}
          DATEI: ${{ vars.SITE_PASSWORT_DATEI }}
          ADRESSE: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$PASSWORT" ] || [ -z "$BENUTZER" ]; then exit 0; fi
          # Kurz warten: Manche Hoster brauchen einen Moment, bis die neue
          # .htaccess greift.
          sleep 10
          URL="${ADRESSE%/}/"
          frage() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@" "$URL" || echo "000"
          }
          ohne=$(frage)
          mit=$(frage -u "$BENUTZER:$PASSWORT")
          echo "Ohne Anmeldung: $ohne, mit Anmeldung: $mit"

          hinweis_500() {
            echo "Ein 500 an dieser Stelle heisst fast immer: Apache findet die"
            echo "Passwortdatei nicht oder darf sie nicht lesen."
            echo ""
            echo "Der schnellste Ausweg ist, die Passwortdatei ganz wegzulassen:"
            echo "**\`SITE_PASSWORT_DATEI\` loeschen** (Settings -> Secrets and variables"
            echo "-> Actions -> Variables) und neu ausrollen. Der Schutz laeuft dann"
            echo "ueber \`mod_rewrite\`, und es gibt keinen Pfad mehr, der falsch sein"
            echo "kann."
            echo ""
            echo "Wer die Passwortdatei behalten will: Gesucht ist der Pfad, den der"
            echo "SERVER sieht -- nicht der FTP-Pfad -- und zwar der des Verzeichnisses,"
            echo "in das dieser Deploy laedt. Am schnellsten zu finden: im Kundenmenue"
            echo "des Hosters einmal den eigenen Verzeichnisschutz auf einen beliebigen"
            echo "Ordner setzen und in die dort erzeugte \`.htaccess\` sehen; die Zeile"
            echo "\`AuthUserFile\` zeigt die richtige Schreibweise. Bleibt es bei 500,"
            echo "sind es die Rechte: \`.htpasswd\` auf 644 setzen."
          }

          case "$ohne:$mit" in
            401:200)
              echo "::notice::Der Verzeichnisschutz greift und die Zugangsdaten stimmen."
              { echo "### Verzeichnisschutz greift"; echo ""
                echo "\`$URL\` antwortet ohne Anmeldung mit **401** und mit Anmeldung mit **200**."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            401:401)
              echo "::error::Das Anmeldefenster kommt, aber die Zugangsdaten werden abgelehnt."
              { echo "### Verzeichnisschutz: Anmeldung schlaegt fehl"; echo ""
                echo "\`$URL\` antwortet ohne Anmeldung mit **401** -- so weit richtig --,"
                echo "weist aber \`$BENUTZER\` mit dem hinterlegten Passwort ebenfalls ab."
                echo ""
                echo "Entweder ist auf dem Server noch eine alte Passwortdatei aktiv, oder"
                echo "\`SITE_PASSWORT\` enthaelt etwas anderes als gedacht (Leerzeichen am"
                echo "Ende zaehlen mit)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            *:500|500:*)
              echo "::error::Die Seite antwortet mit 500 (ohne Anmeldung $ohne, mit Anmeldung $mit)."
              { echo "### Verzeichnisschutz: Fehler 500"; echo ""
                echo "\`$URL\` antwortet ohne Anmeldung mit **$ohne** und mit Anmeldung mit **$mit**."
                echo ""
                hinweis_500
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            200:200)
              echo "::warning::Die Seite ist ohne Passwort erreichbar (200)."
              { echo "### Verzeichnisschutz greift NICHT"; echo ""
                echo "\`$URL\` antwortet auch ohne Anmeldung mit **200** -- die Seite steht offen."
                echo ""
                echo "Moeglich ist, dass der Hoster \`AllowOverride\` nicht erlaubt und die"
                echo "\`.htaccess\` deshalb ignoriert wird, oder dass statische Dateien am"
                echo "Apache vorbei direkt von nginx ausgeliefert werden."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::warning::Antwort ohne Anmeldung $ohne, mit Anmeldung $mit - nicht eindeutig, bitte selbst nachsehen."
              { echo "### Verzeichnisschutz: Antwort $ohne / $mit"; echo ""
                echo "Erwartet waren **401** ohne und **200** mit Anmeldung."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac
