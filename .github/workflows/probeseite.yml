name: Probeseite

# ding.dilehi.de – die Testinstallation von DING.
#
# Bis zum Umzug am 11. September zeigte diese Seite DING, wie ein neuer
# Verein es sieht. Seitdem spricht das Projekt, gegen das sie gebaut wurde,
# mit den Daten von DileHi. Die Seite ist deshalb geleert, und sie baut nicht
# mehr bei jedem Push von selbst.
#
# Später kommt hier eine eigene Installation hin, mit einem eigenen
# Supabase-Projekt: zuerst zum Ausprobieren der Installation, danach hinter
# einem Passwort als Vorführsystem (siehe docs/arbeitsstand.md).
#
# Zwei Aktionen:
#
#   ausrollen   baut DING und lädt es nach ding.dilehi.de. Braucht das
#               Geheimnis PROBE_SUPABASE_PROJECT_REF – mit Absicht nicht
#               SUPABASE_PROJECT_REF: Das ist DileHi, und eine Probeseite, die
#               mit den echten Mitgliederdaten spricht, soll es nicht noch
#               einmal geben.
#   leeren      ersetzt alles auf ding.dilehi.de durch eine leere Seite.

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options:
          - leeren
          - ausrollen
        default: leeren

concurrency:
  group: probeseite
  cancel-in-progress: true

jobs:
  probeseite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.aktion == 'ausrollen' }}

      - uses: actions/setup-node@v4
        if: ${{ inputs.aktion == 'ausrollen' }}
        with:
          node-version: 24

      - name: Datenbank-Adresse und öffentlichen Schlüssel holen
        if: ${{ inputs.aktion == 'ausrollen' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.PROBE_SUPABASE_PROJECT_REF }}
          DILEHI: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$REF" ]; then
            echo "::error::PROBE_SUPABASE_PROJECT_REF fehlt. Die Probeseite braucht ein eigenes Supabase-Projekt."
            exit 1
          fi
          if [ "$REF" = "$DILEHI" ]; then
            echo "::error::PROBE_SUPABASE_PROJECT_REF zeigt auf das Projekt von DileHi. Das ist nicht die Probeseite."
            exit 1
          fi
          # Nur der anon-Schlüssel wird herausgefiltert. Die Antwort enthält
          # auch den service_role-Schlüssel; der geht nirgendwohin weiter.
          anon=$(curl -sS -f "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "Kein anon-Schlüssel im Projekt gefunden."
            exit 1
          fi
          echo "::add-mask::$anon"
          {
            echo "VITE_SUPABASE_URL=https://$REF.supabase.co"
            echo "VITE_SUPABASE_PROJECT_ID=$REF"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon"
          } >> "$GITHUB_ENV"

      - name: Prüfen und bauen
        if: ${{ inputs.aktion == 'ausrollen' }}
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm test
          npm run build

      - name: Leere Seite
        if: ${{ inputs.aktion == 'leeren' }}
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>ding.dilehi.de</title>
          </head>
          <body style="font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;color:#333">
            <p>Hier ist gerade nichts.</p>
            <p>Zum Verein geht es auf <a href="https://www.dilehi.de">www.dilehi.de</a>.</p>
          </body>
          </html>
          HTML

      # Eine Probeseite hat in Suchmaschinen nichts verloren. Sonst stünde
      # ding.dilehi.de neben dilehi.de in den Ergebnissen, mit denselben
      # Texten – und das kostet die echte Seite ihren Rang.
      - name: Für Suchmaschinen sperren
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          cat >> dist/.htaccess <<'HTACCESS'

          # Probeseite: nicht in Suchmaschinen
          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS

      # --delete: Was nicht in dist/ steht, verschwindet vom Webspace. Beim
      # Leeren ist das alles ausser der leeren Seite.
      - name: Hochladen nach ding.dilehi.de
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror --reverse --delete --verbose ./dist/ /ding.dilehi.de/
          "

      - name: Was gelaufen ist
        run: |
          echo "### Probeseite: ${{ inputs.aktion }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.aktion }}" = "leeren" ]; then
            echo "ding.dilehi.de ist leer." >> $GITHUB_STEP_SUMMARY
          else
            echo "Ausgerollt nach https://ding.dilehi.de aus \`${GITHUB_SHA::7}\`." >> $GITHUB_STEP_SUMMARY
          fi
