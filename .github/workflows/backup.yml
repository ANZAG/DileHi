name: Datenbank-Sicherung

# Der kostenlose Supabase-Tarif enthält keine Backups. Diese Aktion zieht
# täglich einen vollständigen Abzug (Schema + Daten), verschlüsselt ihn und legt
# ihn als Artefakt ab.
#
# Einmalig einzurichten – Repository → Settings → Secrets and variables → Actions:
#
#   SUPABASE_DB_URL     Verbindungszeichenfolge aus dem Supabase-Dashboard
#                       (Project Settings → Database → Connection string → URI,
#                       Platzhalter [YOUR-PASSWORD] durch das Passwort ersetzen).
#                       Falls die Direktverbindung nur über IPv6 erreichbar ist,
#                       stattdessen die Zeichenfolge des Session Pooler nehmen.
#
#   BACKUP_PASSPHRASE   Frei gewähltes, langes Passwort für die Verschlüsselung.
#                       Ohne dieses Passwort ist die Sicherung wertlos –
#                       getrennt vom Repository aufbewahren (Passwortmanager).
#
# Wiederherstellen:
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" sicherung.sql.gz.gpg \
#     | gunzip > sicherung.sql
#   psql "$SUPABASE_DB_URL" -f sicherung.sql

on:
  schedule:
    # Täglich 03:17 UTC. Krumme Minute, weil zur vollen Stunde bei GitHub
    # Millionen Jobs gleichzeitig starten und die Ausführung sich verzögert.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Supabase CLI bereitstellen
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Abzug erstellen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt – siehe Kommentar in dieser Datei."
            exit 1
          fi
          mkdir -p backup
          # Schema und Daten getrennt, damit sich im Ernstfall auch nur eines
          # von beiden einspielen lässt.
          supabase db dump --db-url "$DB_URL" --schema public          -f backup/01-schema-public.sql
          supabase db dump --db-url "$DB_URL" --schema storage         -f backup/02-schema-storage.sql
          supabase db dump --db-url "$DB_URL" --data-only --schema public -f backup/03-daten-public.sql
          ls -lh backup/

      - name: Verschlüsseln
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASSPHRASE}" ]; then
            echo "::error::Secret BACKUP_PASSPHRASE fehlt – siehe Kommentar in dieser Datei."
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          tar -czf - -C backup . \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$PASSPHRASE" \
                  --output "dilehi-sicherung-${STAMP}.sql.tar.gz.gpg"
          rm -rf backup
          ls -lh dilehi-sicherung-*.gpg

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: datenbank-sicherung
          path: dilehi-sicherung-*.gpg
          # GitHub bewahrt Artefakte höchstens 90 Tage auf. Für eine längere
          # Aufbewahrung sollte mindestens einmal im Quartal eine Sicherung
          # heruntergeladen und außerhalb von GitHub abgelegt werden.
          retention-days: 90
          if-no-files-found: error
