name: Quellen nachbearbeiten

# Vorhandene Quellen der Quellensammlung mit denselben Werkzeugen
# nachbearbeiten wie neue Scans (scripts/quellen-nachbearbeiten.ts):
#
#   pruefen  nur nachsehen: Welche PDFs haben schon Text, welche Seiten
#            sind Scans und müssten gelesen werden? Schreibt nichts.
#   text     Stufe 1: jede Quelle durchsuchbar machen. Text aus dem PDF
#            übernehmen, wo es selbst welchen hat (am Rechner erstellt);
#            Scan-Seiten aufbereiten und lesen. Die Datei bleibt, wie sie
#            ist – nur der Text kommt in die Suche.
#   probe    Stufe 2 zum Ansehen: für reine Scans (jede Seite ein grosses
#            Bild) ein neues PDF bauen – aufbereitete Seiten, Textebene je
#            Zeile, eine Seitengrösse, nicht feiner als das Original – und
#            nur als Artefakt `quellen-neu` ablegen. Nichts wird ersetzt.
#   verbessern  Stufe 2: dasselbe, und ist das neue PDF besser (mindestens
#            so viel echter Text, nicht grösser), ersetzt es die Datei in
#            SharePoint. Die alte Fassung bleibt im Versionsverlauf der
#            Datei (in SharePoint: Datei → Versionsverlauf → Wiederherstellen).
#   zurueck  für die genannten Quellen die Fassung von vor „vor“ wieder zur
#            aktuellen machen (aus dem Versionsverlauf; legt eine neue
#            Fassung an, nichts geht verloren).
#   austauschen  neu fotografierte Seiten in eine Quelle einsetzen: die
#            Seiten als kleiner Scan (App → Posteingang), „seiten“ sagt, an
#            welche Stellen (PDF-Seiten, in der Reihenfolge des Scans),
#            „eingang“ welche Datei (leer = die neueste). Mit
#            austauschen-probe nur als Artefakt zum Ansehen.
#   txt-loeschen  Textdateien (.txt) entfernen, deren Inhalt das PDF jetzt
#            selbst durchsuchbar hat; quellen = Paare „txt-Kennung:pdf-Kennung“
#   kopie-loeschen  Kopie eines PDFs (anders komprimiert) entfernen;
#            quellen = Paare „kopie-Kennung:original-Kennung“
#   angaben  Titel, Autor, Jahr, Thema und Seitenbeschriftung ins PDF der
#            genannten Quelle schreiben (Seiten bleiben, neue Fassung)
#   leeren   den Suchtext der genannten Quellen entfernen (Datei bleibt)
#   doppelt  die genannten Quellen löschen, wenn es eine ältere mit gleichem
#            Titel und gleicher Grösse gibt (Datei in den Papierkorb).
#
# Quellen, die schon Text in der Suche haben, werden übersprungen (ausser
# mit „neu“). Bricht ein Lauf ab (Zeitlimit), macht der nächste dort weiter.
# Der Bericht steht in der Zusammenfassung des Laufs und als Artefakt.
#
# Einzurichten sind ZWEI Stellen – derselbe Wert, frei gewählt und lang
# (etwa `openssl rand -hex 32`):
#
#   1. GitHub (Repository → Settings → Secrets and variables → Actions)
#        QUELLEN_TOKEN
#   2. Bei Supabase (Dashboard → Edge Functions → Secrets)
#        QUELLEN_TOKEN
#
# Ein eigenes Geheimnis, nicht das der Sicherung: Die Edge Function
# `quellen-werkstatt` kann Text setzen und Dateien ersetzen.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "pruefen = nur nachsehen, text = durchsuchbar machen, probe = neue PDFs zum Ansehen, verbessern = PDFs ersetzen"
        type: choice
        options: [pruefen, text, probe, verbessern, zurueck, doppelt, austauschen-probe, austauschen, txt-pruefen, txt-loeschen, kopie-loeschen, leeren, angaben]
        default: pruefen
      quellen:
        description: "Nur diese Quellen (Kennungen, durch Komma getrennt; leer = alle)"
        type: string
        default: ""
      neu:
        description: "Auch Quellen, die schon Text haben"
        type: boolean
        default: false
      ausser:
        description: "Diese Quellen auslassen (Kennungen, durch Komma getrennt)"
        type: string
        default: ""
      grenze:
        description: "Höchstens so viele Quellen in diesem Lauf (0 = alle)"
        type: string
        default: "0"
      seiten:
        description: "Nur für austauschen: PDF-Seiten, die ersetzt werden (etwa 26,38,72), in der Reihenfolge des neuen Scans"
        type: string
        default: ""
      eingang:
        description: "Nur für austauschen: Name der Datei im Posteingang (leer = die neueste)"
        type: string
        default: ""
      weg:
        description: "Nur für verbessern/probe: textebene = auch Handyfotos nicht neu bauen, nur Textebene ergänzen"
        type: string
        default: ""
      angaben:
        description: "Nur für angaben: „titel=…; autor=…; jahr=…; thema=…; zaehlung=auto“ (oder zaehlung=5:1)"
        type: string
        default: ""
      vor:
        description: "Nur für zurueck: Zeitpunkt (ISO, etwa 2026-11-22T06:00:00Z) – die letzte Fassung davor wird wiederhergestellt"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: quellen-nachbearbeiten
  cancel-in-progress: false

jobs:
  nachbearbeiten:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Werkzeuge für PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Abhängigkeiten
        run: npm ci

      - name: Modelle der Texterkennung
        run: node scripts/ocr-dateien.mjs

      - name: Schlüssel vorhanden?
        env:
          QUELLEN_TOKEN: ${{ secrets.QUELLEN_TOKEN }}
        run: |
          if [ -z "$QUELLEN_TOKEN" ]; then
            echo "::error::Das Secret QUELLEN_TOKEN fehlt (GitHub und Supabase, siehe Kopf dieser Datei)."
            exit 1
          fi

      - name: Nachbearbeiten
        env:
          FUNCTIONS_URL: ${{ secrets.FUNCTIONS_URL || vars.FUNCTIONS_URL || format('https://{0}.supabase.co/functions/v1', secrets.SUPABASE_PROJECT_REF) }}
          QUELLEN_TOKEN: ${{ secrets.QUELLEN_TOKEN }}
          MODUS: ${{ inputs.modus }}
          QUELLEN: ${{ inputs.quellen }}
          NEU: ${{ inputs.neu }}
          GRENZE: ${{ inputs.grenze }}
          AUSSER: ${{ inputs.ausser }}
          VOR: ${{ inputs.vor }}
          ANGABEN: ${{ inputs.angaben }}
          WEG: ${{ inputs.weg }}
          DEBUG_BILD: ${{ inputs.modus == 'austauschen-probe' && 'ja' || '' }}
          SEITEN: ${{ inputs.seiten }}
          EINGANG: ${{ inputs.eingang }}
        run: npx vite-node scripts/quellen-nachbearbeiten.ts

      - name: Bericht ablegen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quellen-bericht
          path: bericht.json
          if-no-files-found: ignore

      - name: Neue PDFs ablegen (probe)
        if: always() && (inputs.modus == 'probe' || inputs.modus == 'austauschen-probe')
        uses: actions/upload-artifact@v5
        with:
          name: quellen-neu
          path: neu/
          retention-days: 14
          if-no-files-found: ignore
