name: Supabase ausrollen

# Migrationen einspielen und Edge Functions bereitstellen – ohne dass jemand
# eine Kommandozeile öffnen muss.
#
# Warum das hier liegt und nicht in einer Anleitung: Wer einen Verein führt,
# hat kein Docker und keinen Supabase-CLI auf dem Rechner, und soll beides auch
# nicht installieren müssen. Ein Knopf auf der Actions-Seite reicht.
#
# Drei Geheimnisse sind vorher zu hinterlegen (Settings → Secrets → Actions):
#
#   SUPABASE_ACCESS_TOKEN   Persönlicher Zugriffsschlüssel aus dem
#                           Supabase-Konto (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    Die Kennung des Projekts, steht in seiner Adresse:
#                           https://<REF>.supabase.co
#   SUPABASE_DB_PASSWORD    Nur für die Migrationen. Beim Anlegen des Projekts
#                           vergeben – und nur dort einmal sichtbar. Wer es
#                           nicht mehr hat, setzt es neu: Project Settings →
#                           Database → Reset database password.

on:
  workflow_dispatch:
    inputs:
      verzeichnis:
        description: "Verzeichnis der Migrationen zurücksetzen (nur bei leerer Datenbank)"
        type: boolean
        default: false
      migrationen:
        description: "Ausstehende Migrationen einspielen"
        type: boolean
        default: true
      funktionen:
        description: "Edge Functions bereitstellen"
        type: boolean
        default: true

jobs:
  ausrollen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Erst nachsehen, dann anfassen ──────────────────────────────────────
      #
      # Ohne diesen Schritt raten wir. „Remote migration versions not found"
      # sagt nicht, in welcher Datenbank sie stehen, und ein SQL-Editor in
      # einem anderen Browsertab sagt nicht, ob es dieselbe ist.
      #
      # Gefragt wird über die Verwaltungsschnittstelle von Supabase – derselbe
      # Weg, den der SQL-Editor im Dashboard geht. Kein Datenbankpasswort, kein
      # Wissen über Regionen oder Anschlüsse nötig.
      #
      # Zwei Abfragen, nicht eine: Das Verzeichnis der Migrationen
      # (`supabase_migrations.schema_migrations`) legt der Supabase-CLI beim
      # ersten Einspielen an. In einem eben erst erstellten Projekt gibt es das
      # Schema noch gar nicht, und eine Abfrage darauf scheitert – nicht als
      # Randfall, sondern im Normalfall, beim ersten Knopfdruck eines neuen
      # Vereins. Vorher stand an dieser Stelle statt des Stands eine
      # Fehlermeldung mit Zeilennummer.
      - name: Datenbank ansehen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Projekt: $REF"

          frage() {
            curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --rawfile q "$1" '{query: $q}')"
          }

          cat > /tmp/frage.sql <<'SQL'
          select
            (select count(*) from information_schema.tables where table_schema = 'public') as tabellen,
            (select count(*) from auth.users) as konten,
            (select count(*) from storage.buckets) as ablagen,
            (to_regclass('supabase_migrations.schema_migrations') is not null) as verzeichnis_da;
          SQL
          frage /tmp/frage.sql | tee /tmp/stand.json
          echo ""

          tabellen=$(jq -r '.[0].tabellen // "?"' /tmp/stand.json 2>/dev/null || echo "?")
          konten=$(jq -r '.[0].konten // "?"' /tmp/stand.json 2>/dev/null || echo "?")
          ablagen=$(jq -r '.[0].ablagen // "?"' /tmp/stand.json 2>/dev/null || echo "?")
          verzeichnis=$(jq -r '.[0].verzeichnis_da // false' /tmp/stand.json 2>/dev/null || echo false)
          echo "VERZEICHNIS_DA=$verzeichnis" >> "$GITHUB_ENV"

          if [ "$tabellen" = "?" ]; then
            migrationen="unbekannt"
          else
            migrationen="noch keins – das ist bei einem neuen Projekt normal"
          fi
          if [ "$verzeichnis" = "true" ]; then
            cat > /tmp/verzeichnis.sql <<'SQL'
            select
              count(*) as eintraege,
              coalesce(min(version), '–') as aelteste,
              coalesce(max(version), '–') as juengste
            from supabase_migrations.schema_migrations;
          SQL
            frage /tmp/verzeichnis.sql | tee /tmp/verzeichnis.json
            echo ""
            anzahl=$(jq -r '.[0].eintraege // "?"' /tmp/verzeichnis.json 2>/dev/null || echo "?")
            aelteste=$(jq -r '.[0].aelteste // "?"' /tmp/verzeichnis.json 2>/dev/null || echo "?")
            juengste=$(jq -r '.[0].juengste // "?"' /tmp/verzeichnis.json 2>/dev/null || echo "?")
            migrationen="$anzahl Einträge, von $aelteste bis $juengste"
          fi

          {
            echo "### Stand der Datenbank, bevor etwas passiert"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tabellen | $tabellen |"
            echo "| Konten | $konten |"
            echo "| Ablagen | $ablagen |"
            echo "| Verzeichnis der Migrationen | $migrationen |"
            if [ "$tabellen" = "?" ]; then
              echo ""
              echo "Die Datenbank hat auf die Frage nach ihrem Stand nicht geantwortet."
              echo "Was sie stattdessen gesagt hat, steht im Protokoll dieses Schritts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Das Verzeichnis der eingespielten Migrationen leeren ───────────────
      #
      # Supabase führt Buch darüber, was schon lief. Steht dort etwas, das es
      # im Projekt nicht mehr gibt – etwa weil achtzig Migrationen zu einem
      # Ausgangsstand zusammengefasst wurden –, verweigert `db push` die
      # Arbeit. Zu Recht: Es kann nicht wissen, ob da noch etwas steht.
      #
      # Gelöscht wird nur, wenn beides zutrifft: keine Konten und keine
      # Tabellen. Die Bedingung steht in der Anweisung selbst, nicht in einer
      # Warnung darüber. Ein Fehlgriff löscht dann nichts, statt das Falsche.
      - name: Verzeichnis der Migrationen zurücksetzen
        if: ${{ inputs.verzeichnis }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Ohne Verzeichnis gibt es nichts zurückzusetzen – und die Abfrage
          # darauf würde scheitern. Genau so sieht ein neues Projekt aus.
          if [ "${VERZEICHNIS_DA:-false}" != "true" ]; then
            echo "Es gibt noch kein Verzeichnis der Migrationen. Nichts zurückzusetzen."
            exit 0
          fi
          cat > /tmp/leeren.sql <<'SQL'
          with geloescht as (
            delete from supabase_migrations.schema_migrations
            where not exists (select 1 from auth.users)
              and not exists (
                select 1 from information_schema.tables where table_schema = 'public'
              )
            returning version
          )
          select
            (select count(*) from geloescht) as entfernt,
            (select count(*) from supabase_migrations.schema_migrations) as verblieben;
          SQL
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --rawfile q /tmp/leeren.sql '{query: $q}')" | tee /tmp/leeren.json
          echo ""
          if grep -q '"entfernt":0' /tmp/leeren.json; then
            echo "Nichts entfernt. Entweder war das Verzeichnis schon leer, oder in"
            echo "der Datenbank stehen Tabellen oder Konten – dann ist sie nicht leer"
            echo "und das Zurücksetzen wäre der falsche Schritt."
          fi

      - name: Projekt verbinden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # „password authentication failed" sagt nicht, warum. Meist ist es kein
      # falsches Passwort, sondern ein mitkopierter Zeilenumbruch oder ein
      # Leerzeichen am Ende. Das sieht man dem Geheimnis in GitHub nicht an,
      # weil das Feld den Inhalt verbirgt.
      #
      # Diese Prüfung verrät nichts über das Passwort ausser dem, was zur
      # Fehlersuche nötig ist: wie lang es ist und ob etwas darin steckt, das
      # die Verbindung stört. Der Wert selbst wird nirgends ausgegeben.
      - name: Passwort auf Transportschäden prüfen
        if: ${{ inputs.migrationen }}
        env:
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "SUPABASE_DB_PASSWORD ist leer oder gar nicht hinterlegt."
            exit 1
          fi
          echo "Länge: ${#PW} Zeichen"
          case "$PW" in
            *[[:space:]]*)
              echo "ACHTUNG: Darin steckt ein Leerzeichen oder ein Zeilenumbruch."
              echo "Das ist fast immer die Ursache. Geheimnis neu setzen und beim"
              echo "Einfügen darauf achten, nichts mitzunehmen."
              ;;
          esac
          rest=$(printf '%s' "$PW" | tr -d 'A-Za-z0-9')
          if [ -n "$rest" ]; then
            echo "Enthält ${#rest} Sonderzeichen. Erlaubt, aber sie machen auf dem Weg"
            echo "zur Datenbank am ehesten Ärger. Wenn es weiter scheitert: Passwort"
            echo "in Supabase neu setzen, nur Buchstaben und Ziffern, dafür lang."
          fi

      # Spielt genau die Migrationen ein, die noch fehlen. Was schon lief,
      # steht in der Datenbank und wird übersprungen – das ist der eigentliche
      # Gewinn gegenüber dem Einfügen von Hand.
      - name: Migrationen
        if: ${{ inputs.migrationen }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Alle auf einmal. Welche ohne Anmeldung erreichbar sein müssen, steht in
      # supabase/config.toml und wird dabei übernommen.
      - name: Edge Functions
        if: ${{ inputs.funktionen }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

      # ── Anmeldung ──────────────────────────────────────────────────────────
      #
      # Ein neues Supabase-Projekt steht auf http://localhost:3000 und lässt
      # jeden ein Konto anlegen. Beides passt nicht zu einem Verein:
      #
      #   Die Adresse braucht Supabase für seine eigenen Mails (etwa die
      #   Bestätigung einer neuen E-Mail-Adresse) und als Liste der Ziele,
      #   auf die ein Anmeldelink zeigen darf.
      #
      #   Mitglieder kommen über Einladungen. Eine offene Registrierung
      #   braucht DING nicht, sie brächte nur fremde Konten. Einladungen aus
      #   der Verwaltung gehen trotzdem – die laufen über den Server.
      #
      # Die Adresse steht als Variable (nicht als Geheimnis) unter Settings →
      # Secrets and variables → Actions → Variables: SITE_URL. Fehlt sie,
      # bleibt dieser Schritt aus.
      - name: Anmeldung einstellen
        if: ${{ vars.SITE_URL != '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          adresse="${SITE_URL%/}"
          case "$adresse" in
            https://*) ;;
            *) echo "SITE_URL muss mit https:// beginnen, steht aber auf: $adresse"; exit 1 ;;
          esac
          jq -n --arg a "$adresse" \
            '{site_url: $a, uri_allow_list: ($a + "/**"), disable_signup: true}' > /tmp/auth.json
          curl -sS -f -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth.json \
            | jq '{site_url, uri_allow_list, disable_signup}'

      # Auch das, was NICHT gelaufen ist, gehört in die Zusammenfassung. Der
      # Schritt „Anmeldung einstellen" überspringt sich still, wenn die
      # Variable SITE_URL fehlt — und das merkt man sonst erst, wenn der erste
      # Einladungslink auf localhost:3000 zeigt.
      - name: Was gelaufen ist
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "### Ausgerollt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Verzeichnis zurückgesetzt: ${{ inputs.verzeichnis }}" >> $GITHUB_STEP_SUMMARY
          echo "- Migrationen: ${{ inputs.migrationen }}" >> $GITHUB_STEP_SUMMARY
          echo "- Edge Functions: ${{ inputs.funktionen }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$SITE_URL" ]; then
            echo "- Anmeldung: Links in Mails zeigen auf $SITE_URL, Selbstregistrierung aus" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Anmeldung: nicht eingestellt.** Die Variable \`SITE_URL\` fehlt (Settings → Secrets and variables → Actions → Variables). Links in Mails zeigen dann auf \`localhost:3000\`." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Die Geheimnisse der Funktionen (Mailversand, VAPID, SETUP_SECRET)" >> $GITHUB_STEP_SUMMARY
          echo "werden hier **nicht** gesetzt. Sie stehen im Supabase-Projekt" >> $GITHUB_STEP_SUMMARY
          echo "unter Edge Functions → Secrets." >> $GITHUB_STEP_SUMMARY
