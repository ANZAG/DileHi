<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Was hier steht, sieht man, bevor die Anwendung geladen ist: im
      Browserreiter, in der Vorschau eines geteilten Links, beim ersten
      Besuch einer Suchmaschine. Bis zum Probelauf stand hier DileHi — Name,
      Beschreibung, Bild, Adresse. Eine fremde Installation trug damit im
      Reiter den Namen eines fremden Vereins.

      Deshalb neutral. Den richtigen Titel setzt die Anwendung, sobald sie
      läuft: aus den Vereinsdaten, je Seite (src/components/SEO.tsx).
    -->
    <title>Vereinsprogramm</title>
    <meta name="description" content="Mitgliederbereich und Website eines Vereins." />

    <meta property="og:title" content="Vereinsprogramm" />
    <meta property="og:description" content="Mitgliederbereich und Website eines Vereins." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary" />

    <!-- Favicon & Touch Icons -->
    <!--
      Zuerst das neutrale Zeichen, dann die .ico für ältere Browser. Wer unter
      Erscheinungsbild ein eigenes Bild hinterlegt, bekommt es zur Laufzeit
      eingesetzt (useBranding) — dann zählt keines von beiden mehr.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Als App auf dem Startbildschirm. Auf dem iPhone ist das zugleich die
         Voraussetzung fuer Push-Meldungen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verein" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
