<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DING">
  <!--
    Das Zeichen einer Installation, die noch keines hat.

    Bis zum Probelauf lag hier DileHis Wappen: Jeder fremde Verein hatte im
    Browserreiter das Zeichen eines Vereins aus Wiesbaden stehen, und zwar so
    lange, bis er ein eigenes hochlud – wenn er überhaupt merkte, woher es kam.

    Deshalb ein neutrales Zeichen: drei Figuren um einen Tisch, mehr braucht es
    nicht. Sobald unter Erscheinungsbild ein eigenes Bild hinterlegt ist, tauscht
    die Anwendung es zur Laufzeit aus (useBranding).

    Ohne Farbe aus den Einstellungen: Eine SVG-Datei im Reiter kennt die
    Vereinsfarbe nicht. Das Grau passt zu jedem Verein und drängt sich nicht auf.
  -->
  <rect width="64" height="64" rx="14" fill="#1c1917" />
  <circle cx="32" cy="24" r="7" fill="#f4f2ee" />
  <circle cx="17" cy="38" r="5.5" fill="#f4f2ee" opacity="0.75" />
  <circle cx="47" cy="38" r="5.5" fill="#f4f2ee" opacity="0.75" />
  <path d="M12 52c0-7 9-11 20-11s20 4 20 11z" fill="#f4f2ee" opacity="0.55" />
</svg>
